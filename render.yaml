services:
  - type: web
    name: telegram-bot-administrator
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: bot_manager
      - key: INVITE_CODE
        generateValue: true
      - key: ALLOW_SELF_SERVICE
        value: "false"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
